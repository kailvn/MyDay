[workspace]
resolver = "2"
members = [
    "crates/myday-core",
    "crates/myday-cli",
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["kailvn"]
repository = "https://github.com/kailvn/MyDay"
description = "Personal schedule, tasks and logs — offline-first (Tauri 2 + Rust)"
homepage = "https://github.com/kailvn/MyDay"

[workspace.dependencies]
myday-core = { path = "crates/myday-core" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"

[profile.release]
lto = true
codegen-units = 1
strip = true
