name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2

      - name: 安装 Tauri Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: cargo test（core / cli / desktop）
        run: cargo test --workspace

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: Playwright 浏览器缓存
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('apps/desktop/pnpm-lock.yaml') }}

      - name: 安装 Playwright Chromium（含系统依赖）
        working-directory: apps/desktop
        run: pnpm exec playwright install --with-deps chromium

      - name: golden 自检（holidays / recurrence / timewords / tpltime）
        working-directory: apps/desktop
        run: pnpm test

      - name: i18n key 覆盖检查
        working-directory: apps/desktop
        run: node scripts/check-i18n.mjs

      - name: Playwright e2e（真 Chromium，浏览器 mock 模式）
        working-directory: apps/desktop
        run: pnpm e2e

  # 移动端 Rust 代码只在 Android 目标编译（cfg(mobile)），主机测试覆盖不到，
  # 用交叉 cargo check 防编译回归（无需 NDK：check 不链接）
  android-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链（Android arm64 目标）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: android-check

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 前端依赖与构建（tauri context 引用 dist）
        working-directory: apps/desktop
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # aws-lc-sys（reqwest 加密后端）交叉编译需要 NDK clang：
      # 通过 CC_<target> 指到 NDK 的 API wrapper（无需完整 Android 构建）
      - name: 安装 NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          sdkmanager --install "ndk;27.2.12479018" > /dev/null

      - name: 交叉编译检查
        run: |
          ndk_bin="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$ndk_bin/aarch64-linux-android21-clang"
          export CXX_aarch64_linux_android="$ndk_bin/aarch64-linux-android21-clang++"
          export AR_aarch64_linux_android="$ndk_bin/llvm-ar"
          cargo check -p myday-desktop --target aarch64-linux-android
