# 发布工作流：推 v* tag 触发，三端构建并自动创建 GitHub Release。
# 桌面产物不签名（公开早期零成本方案）：Windows 下载会有 SmartScreen 提示，
# Release 附 SHA256SUMS.txt 供校验；接入 Azure Trusted Signing 时在
# tauri.conf.json 加 bundle.windows.trustedSigning 并在此补环境变量即可。
# Android APK 用密钥库签名（Secrets：ANDROID_KEYSTORE_B64 = base64 密钥库、
# ANDROID_KEYSTORE_PASS = 密钥库密码；未配置时发布未签名测试包并告警）。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux
            # 只出 deb；AppImage 需要额外系统依赖，需要时再加
            args: --bundles deb
          - os: windows-latest
            label: windows
            # 本地用交叉编译脚本，CI 走原生 MSVC（runner 自带 WebView2/NSIS）
            args: --bundles nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存（按平台隔离）
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-${{ matrix.label }}

      - name: 安装 Tauri Linux 系统依赖
        if: matrix.label == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      - name: 构建（deb / NSIS）并发布 Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: MyDay ${{ github.ref_name }}
          releaseBody: >-
            Offline-first personal planner. Linux: install the .deb
            (`sudo apt install ./MyDay_*_amd64.deb`). Windows: run the
            NSIS installer (unsigned — SmartScreen shows a warning,
            choose "More info" → "Run anyway"; verify with SHA256SUMS.txt).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # 不用 setup-android@v3：其与 cmdline-tools 16 不兼容（尝试安装已废弃的
      # 'tools' 包）；runner 预装 SDK 直接用，这里只接受许可并补 NDK。
      # sdkmanager 不在 PATH 且无 latest 软链——探测版本目录取最新
      - name: 接受 SDK 许可并安装 NDK
        run: |
          sdkm=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)
          yes | "$sdkm" --licenses > /dev/null 2>&1 || true
          "$sdkm" --install "ndk;27.2.12479018" > /dev/null

      - name: Rust 工具链（Android arm64）
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Rust 编译缓存
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: release-android

      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: 前端依赖
        working-directory: apps/desktop
        run: pnpm install --frozen-lockfile

      # gen/ 不入库：CI 首次构建先按 tauri.conf 生成 Android 工程
      - name: 初始化 Android 工程
        working-directory: apps/desktop
        run: test -d src-tauri/gen/android || pnpm tauri android init

      - name: 构建 APK（arm64 release）
        working-directory: apps/desktop
        # tauri CLI 的 --target 用 Android 短名（aarch64 = aarch64-linux-android）
        run: pnpm tauri android build --apk --target aarch64

      - name: 签名
        env:
          MYDAY_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          MYDAY_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          unsigned=$(find src-tauri/gen/android/app/build/outputs/apk \
            -name '*release-unsigned.apk' | head -1)
          ver=$(node -p "require('./apps/desktop/package.json').version")
          if [ -z "$MYDAY_KEYSTORE_B64" ]; then
            echo "::warning::未配置 ANDROID_KEYSTORE_B64 / ANDROID_KEYSTORE_PASS，发布未签名测试包"
            cp "$unsigned" "MyDay_${ver}_android.apk"
          else
            echo "$MYDAY_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            MYDAY_KEYSTORE="$RUNNER_TEMP/keystore.jks" \
              MYDAY_KEYSTORE_PASS="$MYDAY_KEYSTORE_PASS" \
              ../../scripts/sign-android-apk.sh "$unsigned" "MyDay_${ver}_android.apk"
          fi

      - name: 发布 APK 到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: MyDay_*_android.apk

  checksums:
    # 所有平台发布完成后，下载产物生成 SHA256SUMS.txt 挂回 Release。
    # 本 job 不 checkout，gh 必须显式 -R 指定仓库
    needs: [build, android]
    runs-on: ubuntu-latest
    steps:
      - name: 生成并上传 SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          mkdir dist
          gh release download --repo "$REPO" "$TAG" --dir dist --clobber \
            --pattern '*.deb' --pattern '*.exe' --pattern '*.msi' --pattern '*.apk'
          cd dist
          sha256sum * > SHA256SUMS.txt
          cd ..
          gh release upload --repo "$REPO" "$TAG" dist/SHA256SUMS.txt --clobber
